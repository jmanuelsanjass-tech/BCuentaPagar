version: '3.9'

services:
  backend:
    build:
      context: ./demo
      dockerfile: Dockerfile
    container_name: backend-cuentapagar
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/cuentapagar
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: postgres-cuentapagar
    restart: always
    environment:
      POSTGRES_DB: cuentapagar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
