server.port=${PORT:8080}

# Configuración JDBC para Hibernate usando el pooler
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=valide
spring.jpa.show-sql=false
spring.config.import=optional:file:.env[.properties]
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.boot.allow_jdbc_metadata_access=false
spring.jpa.hibernate.ddl-auto=none

# Health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Arranque perezoso: no inicializa beans hasta que se necesitan
spring.main.lazy-initialization=true

# Desactiva la inicialización de JPA hasta que se use
spring.jpa.defer-datasource-initialization=true

# No ejecutes DDL en cada arranque (usa validate o none)
spring.jpa.hibernate.ddl-auto=validate

# Elimina el dialecto explícito (Hibernate lo detecta solo)
# spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Reduce el logging para acelerar
logging.level.org.hibernate=WARN
logging.level.org.springframework=WARN


