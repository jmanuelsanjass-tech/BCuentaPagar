server.port=8080

# Configuración JDBC para Hibernate usando el pooler
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Health check
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=always

# Configuración Supabase para SDK/autenticación
supabase.url=${SUPABASE_URL}
supabase.publishable-key=${SUPABASE_PUBLISHABLE_KEY}
supabase.secret-key=${SUPABASE_SECRET_KEY}
supabase.jwks-url=${SUPABASE_JWKS_URL}
