  <rect x="60" y="1010" width="1470" height="82" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.3"/>
  <text x="84" y="1040" class="group-title">Flujo principal</text>
  <text x="84" y="1067" class="small">Cliente HTTP → Controlador REST → Servicio → Repositorio JPA → PostgreSQL</text>
