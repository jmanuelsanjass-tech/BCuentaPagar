<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1180" viewBox="0 0 1600 1180" role="img" aria-labelledby="title description">
  <title id="title">Arquitectura tecnologica - backend de cuentas por pagar</title>
  <desc id="description">Diagrama de arquitectura general y relaciones entre componentes de un backend Java con Spring Boot, Spring Security, Spring Data JPA y PostgreSQL.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#526581"/>
    </marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2563eb"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #172033; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #526581; }
      .section { font-size: 21px; font-weight: 700; }
      .group-title { font-size: 15px; font-weight: 700; fill: #334766; }
      .node-title { font-size: 15px; font-weight: 700; }
      .node-sub { font-size: 12px; fill: #526581; }
      .small { font-size: 12px; fill: #526581; }
      .group { fill: #f6f8fc; stroke: #cbd5e1; stroke-width: 1.5; }
      .node { fill: #ffffff; stroke: #6b7d99; stroke-width: 1.5; }
      .blue { fill: #eff6ff; stroke: #3b82f6; stroke-width: 1.7; }
      .green { fill: #ecfdf5; stroke: #10b981; stroke-width: 1.7; }
      .purple { fill: #f5f3ff; stroke: #8b5cf6; stroke-width: 1.7; }
      .orange { fill: #fff7ed; stroke: #f59e0b; stroke-width: 1.7; }
      .edge { fill: none; stroke: #526581; stroke-width: 2; marker-end: url(#arrow); }
      .edge-blue { fill: none; stroke: #2563eb; stroke-width: 2; marker-end: url(#arrowBlue); }
      .dotted { stroke-dasharray: 6 5; }
      .edge-label { font-size: 11px; fill: #526581; }
      .rule { stroke: #dbe3ef; stroke-width: 1; }
    </style>
  </defs>

