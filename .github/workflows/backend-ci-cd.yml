name: Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Build and Test (Spring Boot)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5   # ✅ v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5   # ✅ v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        run: mvn clean package -DskipTests --no-transfer-progress

      - name: Run tests
        run: mvn test --no-transfer-progress
        env:
          APP_SECURITY_USERNAME: admin
          APP_SECURITY_PASSWORD: test_password
          DB_URL: jdbc:h2:mem:testdb;MODE=PostgreSQL
          DB_USER: sa
          DB_PASSWORD: ""
        continue-on-error: true

      - name: Upload JAR artifact
        if: success()
        uses: actions/upload-artifact@v4   # ✅ v4 también es Node 24 compatible
        with:
          name: app-jar
          path: demo/target/*.jar
          retention-days: 7

  deploy:
    name: Trigger Render Deploy
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render Deploy Hook
        run: curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}"